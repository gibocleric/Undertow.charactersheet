
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Creator</title>
    <h1>Character Creator</h1>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body {
            background-color: #202020;
            color: white;
            font-family: Georgia, serif;
            padding: 40px;
        }

        .container {
            max-width: 400px;
            margin: auto;
            background-color: #333333;
            padding: 25px;
            border-radius: 10px;
        }

        input, select {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            margin: 8px 0 20px;
            border-radius: 5px;
            border: none;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background-color: #777777;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #999999;
        }

        #result {
            margin-top: 20px;
        }

        .stats {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #777;
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Character Creator</h1>

    <h2>Basic Information</h2>

    <label for="name">Character Name</label>
    <input type="text" id="name" placeholder="Enter name">

    <label for="occupation">Occupation</label>
    <input type="text" id="occupation" placeholder="Enter occupation">

    <label for="age">Age</label>
    <input type="number" id="age" placeholder="Enter age" min="1" step="1">

    <button onclick="createCharacter()">Create Character</button>

    <div id="result"></div>

    <!-- Attribute Selection -->

    <div class="stats" id="statsSection" hidden>

        <h2>Attribute Distribution</h2>

        <p>Assign one unique value to each attribute.</p>

        <label for="influence">Influence</label>
        <select id="influence">
            <option value="">Choose Value</option>
            <option value="25">25</option>
            <option value="30">30</option>
            <option value="40">40</option>
            <option value="45">45</option>
            <option value="50">50</option>
        </select>

        <label for="strength">Strength</label>
        <select id="strength">
            <option value="">Choose Value</option>
            <option value="25">25</option>
            <option value="30">30</option>
            <option value="40">40</option>
            <option value="45">45</option>
            <option value="50">50</option>
        </select>

        <label for="knowledge">Knowledge</label>
        <select id="knowledge">
            <option value="">Choose Value</option>
            <option value="25">25</option>
            <option value="30">30</option>
            <option value="40">40</option>
            <option value="45">45</option>
            <option value="50">50</option>
        </select>

        <label for="deadeye">Dead Eye</label>
        <select id="deadeye">
            <option value="">Choose Value</option>
            <option value="25">25</option>
            <option value="30">30</option>
            <option value="40">40</option>
            <option value="45">45</option>
            <option value="50">50</option>
        </select>

        <label for="resolve">Resolve</label>
        <select id="resolve">
            <option value="">Choose Value</option>
            <option value="25">25</option>
            <option value="30">30</option>
            <option value="40">40</option>
            <option value="45">45</option>
            <option value="50">50</option>
        </select>

        <button onclick="downloadPDF()">
            Download Character Sheet (PDF)
        </button>

    </div>

</div>

<script>

    function createCharacter() {

        const name = document.getElementById("name").value.trim();
        const occupation = document.getElementById("occupation").value.trim();
        const age = document.getElementById("age").value;

        if (
            !name ||
            !occupation ||
            !age ||
            !Number.isInteger(Number(age)) ||
            Number(age) < 1
        ) {
            alert("Please complete all fields correctly.");
            return;
        }

        document.getElementById("result").innerHTML = `
            <hr>
            <h2>Character Created</h2>
            <p><strong>Name:</strong> ${name}</p>
            <p><strong>Occupation:</strong> ${occupation}</p>
            <p><strong>Age:</strong> ${age}</p>
        `;

        document.getElementById("statsSection").hidden = false;
    }


    function downloadPDF() {

        const { jsPDF } = window.jspdf;

        const name = document.getElementById("name").value.trim();
        const occupation = document.getElementById("occupation").value.trim();
        const age = document.getElementById("age").value;

        const stats = {
            "Influence": document.getElementById("influence").value,
            "Strength": document.getElementById("strength").value,
            "Knowledge": document.getElementById("knowledge").value,
            "Dead Eye": document.getElementById("deadeye").value,
            "Resolve": document.getElementById("resolve").value
        };

        // Check that every stat has a value

        if (Object.values(stats).some(value => value === "")) {
            alert("Please assign a value to every attribute.");
            return;
        }

        // Check that all values are unique

        const values = Object.values(stats);

        if (new Set(values).size !== 5) {
            alert("Each attribute must have a unique value. You cannot use the same value twice.");
            return;
        }

        // Generate PDF

        const doc = new jsPDF();

        // Title

        doc.setFont("times", "bold");
        doc.setFontSize(24);
        doc.text("Character Sheet", 20, 25);

        doc.setLineWidth(0.5);
        doc.line(20, 32, 190, 32);

        // Basic Information

        doc.setFont("times", "bold");
        doc.setFontSize(16);
        doc.text("Character Information", 20, 48);

        doc.setFont("times", "normal");
        doc.setFontSize(12);

        doc.text("Name: " + name, 20, 60);
        doc.text("Occupation: " + occupation, 20, 72);
        doc.text("Age: " + age, 20, 84);

        // Attributes

        doc.setFont("times", "bold");
        doc.setFontSize(16);
        doc.text("Attributes", 20, 110);

        doc.setFont("times", "normal");
        doc.setFontSize(13);

        let y = 125;

        for (const [attribute, value] of Object.entries(stats)) {
            doc.text(attribute + ": " + value, 25, y);
            y += 12;
        }

        // Save PDF

        doc.save(name + "_Character_Sheet.pdf");
    }

</script>

</body>
</html>
